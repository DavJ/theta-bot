name: Evaluation Metrics

on:
  workflow_dispatch:
    inputs:
      use_live_data:
        description: 'Download 180 days of public Binance history (never sends orders)'
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - 'spot_bot/**'
      - 'theta_features/**'
      - 'theta_bot_averaging/**'
      - 'tests/**'
      - 'tools/eval_metrics.py'
      - 'test_eval_metrics.py'
      - 'download_binance_data.py'
      - 'scripts/download_binance_archive.py'
      - 'requirements.txt'
      - '.github/workflows/eval-metrics.yml'

permissions:
  contents: read

jobs:
  run-eval-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression suite
        run: python -m pytest -q tests
      - name: Run legacy metrics unit tests
        run: python test_eval_metrics.py
      - name: Download public history (optional)
        if: ${{ inputs.use_live_data && github.event_name == 'workflow_dispatch' }}
        run: python -m scripts.download_binance_archive --out data/raw/BTCUSDT_1h_recent.csv
      - name: Evaluate actual spot strategies on chronological data
        run: |
          if [ "${{ inputs.use_live_data }}" = "true" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m spot_bot.evaluate --csv data/raw/BTCUSDT_1h_recent.csv --data-source binance_archive --out bench_out/evaluation
          else
            python -m spot_bot.evaluate --out bench_out/evaluation
          fi
      - name: Show screening result
        run: cat bench_out/evaluation/report.md
      - name: Upload inspectable evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thetabot-evaluation
          path: bench_out/evaluation/
          if-no-files-found: error
          retention-days: 30
